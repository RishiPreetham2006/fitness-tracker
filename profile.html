<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack Profile</title><style>body{margin:0;background:#f4faf7;font:16px system-ui;color:#16372b}.wrap{max-width:760px;margin:32px auto;padding:22px}.card{background:white;border:1px solid #dcebe4;border-radius:22px;padding:26px;box-shadow:0 12px 28px #153c2b08}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.logo{font-size:23px;font-weight:900}.logo span{color:#10a879}label{display:block;font-weight:700;margin:15px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cdded4;border-radius:10px;font:inherit}button,.btn{display:inline-block;margin-top:18px;padding:12px 18px;border:0;border-radius:10px;background:#12a879;color:white;font-weight:800;cursor:pointer}a{color:#0a8759;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}#msg{min-height:22px;color:#0a8759}@media(max-width:540px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a class="logo" href="index.html">Fit<span>Track</span></a><div><a href="user.html">← Dashboard</a> · <a href="index.html">Home</a></div></div><section class="card"><h1>Your profile</h1><p>Manage your demo profile details saved in this browser.</p><form id="profileForm"><label>Name</label><input id="name" autocomplete="name"><label>Email</label><input id="email" type="email" disabled><div class="grid"><div><label>Age</label><input id="age" type="number" min="1" max="120"></div><div><label>Height (cm)</label><input id="height" type="number" min="50" max="250"></div><div><label>Weight (kg)</label><input id="weight" type="number" min="1" max="500"></div><div><label>Goal</label><select id="goal"><option>General fitness</option><option>Build strength</option><option>Improve endurance</option><option>Improve flexibility</option><option>Weight management</option></select></div></div><button type="submit">Save profile</button></form><p id="msg" role="status"></p><button type="button" onclick="logout()">Log out</button></section></main><script>
if(localStorage.getItem('loggedIn')!=='true'||localStorage.getItem('userRole')!=='user'){location.replace('login.html');}
const email=localStorage.getItem('userEmail')||'',key='fittrackProfile:'+email;document.getElementById('email').value=email;const profile=JSON.parse(localStorage.getItem(key)||'{}');['name','age','height','weight','goal'].forEach(k=>{if(profile[k]!=null)document.getElementById(k).value=profile[k];});document.getElementById('name').value=profile.name||'';document.getElementById('profileForm').addEventListener('submit',e=>{e.preventDefault();const data={};['name','age','height','weight','goal'].forEach(k=>data[k]=document.getElementById(k).value);localStorage.setItem(key,JSON.stringify(data));document.getElementById('msg').textContent='Profile saved successfully.';});function logout(){localStorage.removeItem('loggedIn');localStorage.removeItem('userRole');localStorage.removeItem('userEmail');localStorage.removeItem('userName');location.href='index.html';}
</script><script src="fittrack-nav.js"></script>
</body></html>
