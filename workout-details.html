<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Details - FitTrack</title><style>body{margin:0;min-height:100vh;background:linear-gradient(135deg,#063b32,#12a879);display:grid;place-items:center;padding:18px;font-family:system-ui}.box{background:white;border-radius:24px;padding:30px;width:min(100%,680px);text-align:center;box-shadow:0 24px 50px #002b1d40;color:#14382b}.logo{font-size:24px;font-weight:900}.logo span{color:#12a879}.timer{font-size:54px;font-weight:900;color:#0ca16b;margin:24px}.btn{border:0;border-radius:10px;padding:12px 18px;margin:5px;font-weight:800;cursor:pointer}.start{background:#12a879;color:white}.pause{background:#ffe7a3}.finish{background:#ef6a62;color:white}.list{line-height:1.8;text-align:left;background:#f5faf7;padding:20px;border-radius:14px}a{color:#0b8659;font-weight:bold;text-decoration:none}.notice{min-height:25px;color:#0b8659}</style></head><body><main class="box"><a class="logo" href="user.html">Fit<span>Track</span></a><h1 id="title">Workout</h1><p id="desc">Follow the suggested session and take breaks as needed.</p><div class="list" id="instructions"></div><h2>Session timer</h2><div class="timer" id="timer">00:00</div><button class="btn start" id="start">Start</button><button class="btn pause" id="pause" disabled>Pause</button><button class="btn finish" id="complete" disabled>Complete</button><p class="notice" id="msg" role="status"></p><p><a href="workout.html">← Workout library</a> · <a href="user.html">Dashboard</a></p></main><script>
const workouts={running:{name:'Running',emoji:'🏃',desc:'Cardio session to build stamina',steps:['Warm up with a brisk walk','Alternate easy jog and recovery if needed','Cool down walking'],calories:250},cycling:{name:'Cycling',emoji:'🚴',desc:'Endurance ride at a manageable pace',steps:['Check bike and surroundings','Ride at a steady comfortable effort','Finish with a gentle cool-down'],calories:220},yoga:{name:'Yoga',emoji:'🧘',desc:'Gentle mobility and breathing session',steps:['Begin with slow breathing','Move through gentle stretches','Finish in a relaxed resting pose'],calories:120},strength:{name:'Strength training',emoji:'🏋️',desc:'Basic strength session',steps:['Warm up before strength exercises','Use controlled bodyweight or light resistance','Stop if you feel pain'],calories:180},walking:{name:'Walking',emoji:'🚶',desc:'Low-impact steady movement',steps:['Walk easy for 3 minutes to warm up','Walk at a pace where you can still talk','Cool down slowly'],calories:100},hiit:{name:'HIIT',emoji:'🔥',desc:'Beginner-friendly intervals',steps:['Warm up with light movement','Alternate 20 seconds of brisk movement and 40 seconds of recovery for 5 rounds','Cool down and stretch'],calories:220},cardio:{name:'Cardio circuit',emoji:'💓',desc:'Simple cardio movement session',steps:['Warm up gently','Choose marching, step-touch or light jog in place for intervals','Cool down and hydrate'],calories:160},stretching:{name:'Stretching',emoji:'🧎',desc:'Gentle full-body stretch',steps:['Move slowly without bouncing','Hold comfortable stretches and breathe','Stop if you feel sharp pain'],calories:70},home:{name:'Home workout',emoji:'🏠',desc:'Equipment-free movement',steps:['Warm up with marching in place','Try squats, wall push-ups and glute bridges at a comfortable pace','Cool down'],calories:150},fullbody:{name:'Full body workout',emoji:'💪',desc:'Balanced bodyweight session',steps:['Warm up','Cycle through squats, wall push-ups, glute bridges and standing rows if available','Rest between rounds and cool down'],calories:200},abs:{name:'Abs & core',emoji:'🧱',desc:'Core stability session',steps:['Warm up','Try dead bugs, bird dogs and short comfortable planks','Keep breathing and avoid straining'],calories:120},beginner:{name:'Beginner workout',emoji:'🌱',desc:'A gentle starter session',steps:['Warm up with a slow walk','Do easy sit-to-stands and wall push-ups','Rest as needed and cool down'],calories:110},flexibility:{name:'Flexibility flow',emoji:'🤸',desc:'Gentle mobility session',steps:['Start with neck and shoulder rolls','Move through comfortable hip and hamstring stretches','Finish with slow breathing'],calories:80},quick:{name:'Quick 10-minute workout',emoji:'⚡',desc:'Short movement break',steps:['Warm up for 1 minute','Alternate marching, step-touches and gentle squats for 8 minutes','Cool down for 1 minute'],calories:90}};
const key=(new URLSearchParams(location.search).get('workout')||'walking').toLowerCase();const w=workouts[key]||workouts.walking;document.title=w.name+' | FitTrack';document.getElementById('title').textContent=w.emoji+' '+w.name;document.getElementById('desc').textContent=w.desc;document.getElementById('instructions').innerHTML='<strong>Session guide</strong><ol>'+w.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>';let secs=0,interval=null;function draw(){document.getElementById('timer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}document.getElementById('start').onclick=()=>{if(interval)return;interval=setInterval(()=>{secs++;draw()},1000);document.getElementById('start').disabled=true;document.getElementById('pause').disabled=false;document.getElementById('complete').disabled=false;document.getElementById('msg').textContent='Session started.'};document.getElementById('pause').onclick=()=>{clearInterval(interval);interval=null;document.getElementById('start').disabled=false;document.getElementById('pause').disabled=true;document.getElementById('msg').textContent='Paused.'};document.getElementById('complete').onclick=()=>{clearInterval(interval);interval=null;const history=JSON.parse(localStorage.getItem('workoutHistory')||'[]');history.push({name:w.name,calories:w.calories,date:new Date().toLocaleDateString(),duration:secs});localStorage.setItem('workoutHistory',JSON.stringify(history));document.getElementById('msg').textContent='Workout recorded. Nice work!';document.getElementById('start').disabled=false;document.getElementById('pause').disabled=true;document.getElementById('complete').disabled=true;secs=0;draw()};
</script><script src="fittrack-nav.js"></script>
</body></html>
