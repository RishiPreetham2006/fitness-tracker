<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sleep - FitTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #063b35, #00b894);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .sleep-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #063b35;
            margin-bottom: 10px;
        }

        .logo span {
            color: #00b894;
        }

        .sleep-icon {
            font-size: 70px;
            margin: 15px 0;
        }

        h1 {
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #00b894;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00e5a8, #00b894);
            color: #063b35;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 184, 148, 0.3);
        }

        .message {
            margin-top: 18px;
            min-height: 22px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #063b35;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: #00b894;
        }

        @media (max-width: 500px) {
            .sleep-container {
                width: 100%;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="sleep-container">

        <div class="logo">
            Fit<span>Track</span>
        </div>

        <div class="sleep-icon">😴</div>

        <h1>Add Sleep</h1>

        <p class="subtitle">
            Enter how many hours you slept today.
        </p>

        <div class="input-group">

            <label for="sleep">
                Sleep Hours
            </label>

            <input
                type="number"
                id="sleep"
                placeholder="Example: 7.5"
                min="0"
                max="24"
                step="0.5"
            >

        </div>

        <button onclick="saveSleep()">
            Add Sleep
        </button>

        <div class="message" id="message"></div>

        <a href="fitness.html" class="back">
            ← Back to Dashboard
        </a>

    </div>

    <script>
        function saveSleep() {

            const sleep =
                document.getElementById("sleep").value;

            const message =
                document.getElementById("message");

            if (sleep === "" || sleep < 0 || sleep > 24) {

                message.style.color = "red";

                message.textContent =
                    "Please enter a valid sleep duration.";

                return;
            }

            localStorage.setItem(
                "todaySleep",
                sleep
            );

            message.style.color = "#00a884";

            message.textContent =
                sleep +
                " hours of sleep added successfully!";

            setTimeout(function () {
                window.location.href = "fitness.html";
            }, 1000);
        }
    </script>

    <script src="daily-log.js"></script>
<script src="fittrack-nav.js"></script>
</body>
</html>
