<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create FitTrack Account</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#073b2d,#11a879);font-family:system-ui;color:#15382c;padding:18px}.box{background:#fff;border-radius:22px;padding:30px;width:min(100%,460px);box-shadow:0 24px 50px #002f2050}.logo{font-size:24px;font-weight:900;margin-bottom:12px}.logo span{color:#12a879}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cdded4;border-radius:10px;font:inherit}button{margin-top:18px;width:100%;border:0;background:#12a879;color:white;font-weight:800;padding:13px;border-radius:11px;cursor:pointer}a{color:#09885b;font-weight:700}.note{font-size:13px;color:#66746d;line-height:1.5}#msg{min-height:22px;color:#c0392b}</style></head><body><main class="box"><a class="logo" href="index.html">Fit<span>Track</span></a><h1>Create your account</h1><p>Start with the free demo plan.</p><form id="registerForm"><label for="name">Full name</label><input id="name" autocomplete="name" required><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password (at least 6 characters)</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" required><button>Create account</button></form><p id="msg" role="status"></p><p class="note">Demo only: credentials are stored in browser localStorage. Do not use a real password.</p><p>Already registered? <a href="login.html">Log in</a></p><a href="index.html">← Public home</a></main><script>
const KEY='fittrackDemoAccounts';document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value,confirm=document.getElementById('confirm').value,msg=document.getElementById('msg');if(pw!==confirm){msg.textContent='Passwords do not match.';return;}let accounts=JSON.parse(localStorage.getItem(KEY)||'[]');if(accounts.some(a=>a.email===email)){msg.textContent='An account with this email already exists.';return;}accounts.push({name,email,password:pw,role:'user',plan:'Free'});localStorage.setItem(KEY,JSON.stringify(accounts));localStorage.setItem('loggedIn','true');localStorage.setItem('userEmail',email);localStorage.setItem('userRole','user');localStorage.setItem('userName',name);msg.style.color='#0a8c59';msg.textContent='Account created and signed in. Opening your dashboard…';setTimeout(()=>location.href='user.html',500);});</script></body></html>
