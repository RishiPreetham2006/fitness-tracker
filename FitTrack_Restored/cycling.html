<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cycling Workout - FitTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #063b35,
                    #00b894
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .workout-container {
            width: 100%;
            max-width: 650px;

            background: white;

            border-radius: 25px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #063b35;
            margin-bottom: 15px;
        }

        .logo span {
            color: #00b894;
        }

        .workout-icon {
            font-size: 80px;
            margin: 10px 0 15px;
        }

        h1 {
            color: #063b35;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: #f2fffb;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #d8f7ef;
        }

        .stat-box h3 {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-box p {
            color: #063b35;
            font-size: 30px;
            font-weight: bold;
        }

        .timer-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 55px;
            font-weight: bold;
            color: #00a884;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn {
            background:
                linear-gradient(
                    135deg,
                    #00e5a8,
                    #00b894
                );

            color: #063b35;
        }

        .pause-btn {
            background: #ffeaa7;
            color: #6b5200;
        }

        .finish-btn {
            background: #ff7675;
            color: white;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 18px
                rgba(0, 0, 0, 0.15);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            min-height: 25px;
            font-weight: bold;
            color: #00a884;
            margin-bottom: 15px;
        }

        .back {
            display: inline-block;
            text-decoration: none;
            color: #063b35;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .back:hover {
            background: #f0faf7;
            color: #00a884;
        }

        @media (max-width: 550px) {

            .workout-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }

            #timer {
                font-size: 45px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <div class="workout-container">

        <!-- LOGO -->

        <div class="logo">
            Fit<span>Track</span>
        </div>

        <!-- ICON -->

        <div class="workout-icon">
            🚴
        </div>

        <!-- TITLE -->

        <h1>
            Cycling Workout
        </h1>

        <p class="subtitle">
            Cycle your way to better fitness and endurance.
        </p>

        <!-- STATS -->

        <div class="stats">

            <div class="stat-box">

                <h3>
                    Target Duration
                </h3>

                <p>
                    45 min
                </p>

            </div>

            <div class="stat-box">

                <h3>
                    Target Calories
                </h3>

                <p>
                    400
                </p>

            </div>

        </div>

        <!-- TIMER -->

        <div class="timer-label">
            Workout Time
        </div>

        <div id="timer">
            00:00:00
        </div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button
                class="start-btn"
                id="startBtn"
                onclick="startWorkout()">

                ▶ Start

            </button>

            <button
                class="pause-btn"
                id="pauseBtn"
                onclick="pauseWorkout()"
                disabled>

                ⏸ Pause

            </button>

            <button
                class="finish-btn"
                id="finishBtn"
                onclick="finishWorkout()"
                disabled>

                ⏹ Finish Workout

            </button>

        </div>

        <!-- MESSAGE -->

        <div id="message"></div>

        <!-- BACK -->

        <a
            href="workout.html"
            class="back">

            ← Back to Workouts

        </a>

    </div>


    <script>

        let seconds = 0;

        let timerInterval = null;

        let isRunning = false;


        /* ================= START ================= */

        function startWorkout() {

            if (isRunning) {
                return;
            }

            isRunning = true;

            timerInterval = setInterval(
                function () {

                    seconds++;

                    updateTimer();

                },
                1000
            );

            document.getElementById(
                "startBtn"
            ).disabled = true;

            document.getElementById(
                "pauseBtn"
            ).disabled = false;

            document.getElementById(
                "finishBtn"
            ).disabled = false;

            document.getElementById(
                "message"
            ).textContent =
                "Cycling workout started! 💪";
        }


        /* ================= PAUSE ================= */

        function pauseWorkout() {

            if (!isRunning) {
                return;
            }

            clearInterval(timerInterval);

            isRunning = false;

            document.getElementById(
                "startBtn"
            ).disabled = false;

            document.getElementById(
                "pauseBtn"
            ).disabled = true;

            document.getElementById(
                "message"
            ).textContent =
                "Workout paused ⏸️";
        }


        /* ================= TIMER ================= */

        function updateTimer() {

            const hours =
                Math.floor(seconds / 3600);

            const minutes =
                Math.floor(
                    (seconds % 3600) / 60
                );

            const secs =
                seconds % 60;

            document.getElementById(
                "timer"
            ).textContent =

                String(hours).padStart(2, "0")
                + ":" +

                String(minutes).padStart(2, "0")
                + ":" +

                String(secs).padStart(2, "0");
        }


        /* ================= FINISH ================= */

        function finishWorkout() {

            clearInterval(timerInterval);

            isRunning = false;

            const calories = 400;


            /* ADD CALORIES TO TODAY */

            let currentCalories =
                Number(
                    localStorage.getItem(
                        "todayCalories"
                    )
                ) || 1850;

            currentCalories += calories;

            localStorage.setItem(
                "todayCalories",
                currentCalories
            );


            /* =========================
               SAVE WORKOUT HISTORY
            ========================= */

            let workoutHistory =
                JSON.parse(
                    localStorage.getItem(
                        "workoutHistory"
                    )
                ) || [];


            workoutHistory.push({

                name: "Cycling",

                calories: calories,
                date: new Date().toLocaleDateString()

            });


            localStorage.setItem(
                "workoutHistory",
                JSON.stringify(
                    workoutHistory
                )
            );


            /* SAVE LAST WORKOUT */

            localStorage.setItem(
                "lastWorkout",
                "Cycling"
            );

            localStorage.setItem(
                "lastWorkoutCalories",
                calories
            );


            /* BUTTON SETTINGS */

            document.getElementById(
                "startBtn"
            ).disabled = false;

            document.getElementById(
                "pauseBtn"
            ).disabled = true;

            document.getElementById(
                "finishBtn"
            ).disabled = true;


            /* SUCCESS MESSAGE */

            document.getElementById(
                "message"
            ).textContent =

                "Cycling workout completed! 🔥 "
                + calories
                + " calories added.";
        }

    </script>

    <script src="daily-log.js"></script>
<script src="fittrack-nav.js"></script>
</body>

</html>
